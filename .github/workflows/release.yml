name: "Test GitHub Action"
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: create-json
        id: create-json
        uses: ./
        with:
          name: "test.json"
          json: '{"name":"json successfully created!"}'
      - run: sh ./test-json.sh
